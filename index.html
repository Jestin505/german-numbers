<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>German Numbers Practice A1</title>
<style>
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    background-color: #f0f4f8; 
    margin: 0; 
  }
  .app-card { 
    text-align: center; 
    background: white; 
    padding: 40px; 
    border-radius: 16px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
    width: 90%; 
    max-width: 400px; 
  }
  h2 { color: #333; margin-top: 0; }
  .btn { 
    background-color: #0056b3; 
    color: white; 
    border: none; 
    padding: 12px 24px; 
    font-size: 16px; 
    font-weight: bold;
    border-radius: 8px; 
    cursor: pointer; 
    margin: 8px; 
    transition: background-color 0.2s;
  }
  .btn:hover { background-color: #004494; }
  .btn-secondary { background-color: #6c757d; }
  .btn-secondary:hover { background-color: #5a6268; }
  .btn-icon { background-color: #28a745; }
  .btn-icon:hover { background-color: #218838; }
  
  #number-display { 
    font-size: 64px; 
    font-weight: bold; 
    color: #1a1a1a;
    margin: 20px 0; 
  }
  #spelling-display { 
    font-size: 24px; 
    color: #0056b3; 
    font-weight: 500;
    margin-bottom: 10px; 
    min-height: 36px;
  }
  #listen-container {
    min-height: 50px;
    margin-bottom: 20px;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="app-card">
  <!-- Start Screen -->
  <div id="start-screen">
    <h2>German Numbers A1</h2>
    <p style="color: #666; margin-bottom: 24px;">Practice numbers from 0 to 999 with audio</p>
    <button class="btn" onclick="startPractice()">Practice numbers</button>
  </div>

  <!-- Practice Screen -->
  <div id="practice-screen" class="hidden">
    <div id="number-display">0</div>
    <div id="spelling-display"></div>
    
    <div id="listen-container">
      <button id="listen-btn" class="btn btn-icon hidden" onclick="playAudio()">🔊 Listen Again</button>
    </div>
    
    <div>
      <button class="btn" onclick="checkNumber()">Check</button>
      <button class="btn btn-secondary" onclick="nextNumber()">Next</button>
    </div>
  </div>
</div>

<script>
  let currentNumber = 0;
  let currentSpelling = "";

  // Logic to convert digits into correct German spelling
  function numberToGerman(num) {
    if (num === 0) return "null";
    
    const units = ["", "ein", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun"];
    const ones = ["", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun"];
    const teens = ["zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
    const tens = ["", "", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];
    
    let result = "";
    let hundreds = Math.floor(num / 100);
    let remainder = num % 100;
    
    if (hundreds === 1) result += "einhundert";
    else if (hundreds > 1) result += units[hundreds] + "hundert";
    
    if (remainder > 0) {
      if (remainder < 10) {
         result += ones[remainder];
      } else if (remainder >= 10 && remainder < 20) {
         result += teens[remainder - 10];
      } else {
         let t = Math.floor(remainder / 10);
         let u = remainder % 10;
         if (u === 0) {
            result += tens[t]; 
         } else {
            result += units[u] + "und" + tens[t]; 
         }
      }
    }
    return result.charAt(0).toUpperCase() + result.slice(1);
  }

  // Audio function using the browser's native speech synthesis
  function playAudio() {
    if ('speechSynthesis' in window) {
      // Cancel any ongoing speech to prevent overlap
      window.speechSynthesis.cancel(); 
      
      const utterance = new SpeechSynthesisUtterance(currentSpelling);
      utterance.lang = 'de-DE'; // Forces the browser to use a German voice
      utterance.rate = 0.9; // Slightly slower for language learners
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Sorry, your browser does not support text-to-speech audio.");
    }
  }

  // Application flow
  function startPractice() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('practice-screen').classList.remove('hidden');
    nextNumber();
  }

  function nextNumber() {
    currentNumber = Math.floor(Math.random() * 1000);
    document.getElementById('number-display').innerText = currentNumber;
    
    // Reset the display for the next number
    document.getElementById('spelling-display').innerText = "";
    document.getElementById('listen-btn').classList.add('hidden');
    window.speechSynthesis.cancel(); 
  }

  function checkNumber() {
    currentSpelling = numberToGerman(currentNumber);
    document.getElementById('spelling-display').innerText = currentSpelling;
    document.getElementById('listen-btn').classList.remove('hidden');
    
    // Automatically play the audio when "Check" is clicked
    playAudio();
  }
</script>
</body>
</html>
